<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="robots" content="noindex">
<title>Compliance Hub · Video Shots</title>
<!--
  Recording surface for the AI Compliance video (v3). Not linked from the site.
  Every shot is a pure function of time: ?shot=<name>&t=<seconds>, or window.seek(t).
  ?play=1 plays the shot in real time (looping) for previewing in a browser.
  Shots: hub, connectors, readiness, gap
-->
<style>
  :root {
    color-scheme: dark;
    --paper:#070d19; --surface:#0e1729; --surface-2:#142036; --surface-3:#1a2942;
    --ink:#eaf1fb; --ink-soft:#a6b6cc; --ink-faint:#6b7f99;
    --line:#1f2e46; --line-strong:#2d4262;
    --accent:#5aa8ff; --accent-2:#7fd6ff;
    --crit:#f0645a; --warn:#e9b040; --good:#3fd18b; --good-soft:#3fd18b22;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); }
  body { color:var(--ink); font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric:tabular-nums; }
  .mono { font-family:"Cascadia Mono",Consolas,ui-monospace,monospace; }

  #stage { position:fixed; inset:0; width:1440px; height:810px; overflow:hidden;
    background:
      radial-gradient(ellipse 70% 60% at 100% 0%, #2f7bff1f, transparent 60%),
      radial-gradient(ellipse 70% 60% at 0% 100%, #2f7bff17, transparent 60%), var(--paper); }
  #world { position:absolute; left:0; top:0; width:1440px; height:810px; transform-origin:0 0; }
  .view { position:absolute; inset:0; display:none; }
  .view.on { display:block; }

  /* ── App chrome ── */
  .bar { position:absolute; left:0; right:0; top:0; height:78px; display:flex; align-items:center; gap:18px; padding:0 28px;
    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0e172966,#0e172900); }
  .bar::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--accent),#5aa8ff55 55%,transparent); }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(140deg,#2f7bff,#3fd1c1); box-shadow:0 6px 18px #2f7bff55; }
  .mark svg { width:22px; height:22px; }
  .brand .eb { font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .brand h1 { margin:2px 0 0; font-size:24px; font-weight:650; letter-spacing:-.01em; line-height:1.1; }
  .tabs { margin-left:auto; display:flex; gap:4px; padding:4px; border-radius:999px; border:1px solid var(--line-strong); background:#0b1424aa; }
  .tabs span { font-size:13px; font-weight:600; color:var(--ink-soft); padding:7px 15px; border-radius:999px; }
  .tabs span.sel { color:var(--ink); background:var(--surface-3); }
  .live { display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; letter-spacing:.06em;
    color:var(--good); background:var(--good-soft); border:1px solid #3fd18b55; }
  .live .dot { width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 #3fd18b88; }

  .mod { position:absolute; background:linear-gradient(180deg,#111c31,#0d1627); border:1px solid var(--line); border-radius:16px;
    box-shadow:inset 0 1px 0 #ffffff0d, 0 14px 34px #02060f66; }
  .mod-h { display:flex; align-items:center; justify-content:space-between; padding:14px 18px 0; }
  .mod-t { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
  .chip { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:999px; color:var(--accent); background:#5aa8ff1a; border:1px solid #5aa8ff44; }

  /* KPIs */
  .kpi { padding:16px 18px; }
  .kpi .k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
  .kpi .v { font-size:34px; font-weight:650; line-height:1.1; margin-top:8px; letter-spacing:-.01em; }
  .kpi .v small { font-size:15px; color:var(--ink-soft); font-weight:600; margin-left:3px; }
  .kpi .d { margin-top:6px; font-size:12px; font-weight:650; color:var(--good); }
  .kpi svg.spark { position:absolute; right:16px; bottom:16px; width:92px; height:34px; }

  /* Radar */
  .radar text { fill:#dfe8f5; font-size:12.5px; font-weight:600; }
  .radar .ring { fill:none; stroke:#2a3d5c; stroke-width:1; }
  .radar .spoke { stroke:#2a3d5c; stroke-width:1; }
  .radar .shape { fill:#5aa8ff2a; stroke:#7fbaff; stroke-width:1.6; stroke-linejoin:round; }
  .radar .ideal { fill:none; stroke:#8ea4bc; stroke-width:1.2; stroke-dasharray:3 4; opacity:.55; }

  /* Score tiles */
  .score { padding:13px 15px 14px; }
  .score .n { font-size:13.5px; font-weight:650; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score .row { display:flex; align-items:center; gap:10px; margin-top:11px; }
  .score .lab { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
  .score .val { margin-left:auto; font-size:20px; font-weight:650; }
  .score .val small { font-size:12px; color:var(--ink-faint); }
  .track { position:relative; height:8px; margin-top:10px; border-radius:99px; background:#1d2b44; }
  .fill { position:absolute; left:0; top:0; bottom:0; border-radius:99px; }
  .knob { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:#fff; border:3px solid; }
  .gp { position:absolute; right:12px; top:11px; display:none; align-items:center; gap:6px; font-size:10.5px; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; padding:4px 9px; border-radius:999px; }

  /* Activity feed */
  .feed { position:absolute; left:16px; right:16px; top:52px; bottom:14px; overflow:hidden; }
  .ev { position:absolute; left:0; right:0; height:56px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:12px;
    background:#0b1424; border:1px solid var(--line); }
  .ev .ic { width:30px; height:30px; flex:0 0 30px; border-radius:9px; display:grid; place-items:center; font-size:11px; font-weight:800; color:#fff; }
  .ev .tx { min-width:0; flex:1; }
  .ev .t1 { font-size:13px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev .t2 { font-size:11.5px; color:var(--ink-faint); margin-top:2px; white-space:nowrap; }
  .ev .ok { font-size:10.5px; font-weight:800; letter-spacing:.08em; color:var(--good); background:var(--good-soft); padding:4px 8px; border-radius:99px; }

  /* Gap card */
  #gapcard { position:absolute; width:560px; padding:22px 24px 22px; display:none; border-color:#2d4262; }
  #gapcard .eb { font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:var(--crit); display:flex; align-items:center; gap:8px; }
  #gapcard h3 { margin:8px 0 4px; font-size:23px; font-weight:650; letter-spacing:-.01em; }
  #gapcard p { margin:0; color:var(--ink-soft); font-size:14px; line-height:1.45; }
  .proj { margin-top:18px; padding:14px 16px; border-radius:12px; background:#0a1322; border:1px solid var(--line); }
  .proj .lbl { display:flex; justify-content:space-between; font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--ink-faint); }
  .proj .track { height:10px; margin-top:12px; }
  .proj .nums { display:flex; justify-content:space-between; margin-top:7px; font-size:11px; color:var(--ink-faint); padding:0 2px; }
  .cta { margin-top:16px; display:flex; align-items:center; gap:14px; }
  .btn { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:#04101f; padding:11px 18px; border-radius:999px;
    background:linear-gradient(135deg,#5aa8ff,#7fd6ff); box-shadow:0 8px 24px #5aa8ff44; }
  .agents { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); }
  .av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:800; color:#fff; border:2px solid #0d1627; }
  .av + .av { margin-left:-10px; }
  .steps { margin-top:16px; display:none; flex-direction:column; gap:9px; }
  .st { display:flex; align-items:center; gap:12px; font-size:14px; font-weight:600; color:var(--ink-soft); }
  .st .b { width:22px; height:22px; border-radius:50%; border:2px solid #2d4262; display:grid; place-items:center; flex:0 0 22px; }
  .st .b svg { width:12px; height:12px; opacity:0; }
  .st.done { color:var(--ink); }
  .st.done .b { background:var(--good); border-color:var(--good); }
  .st.done .b svg { opacity:1; }
  .st.run .b { border-color:var(--accent); border-top-color:transparent; }
  .deploy { display:none; align-items:center; gap:10px; margin-top:16px; padding:10px 14px; border-radius:12px; font-size:13.5px; font-weight:700;
    color:var(--accent-2); background:#5aa8ff14; border:1px solid #5aa8ff44; }

  /* ── Connectors ── */
  .ctitle { position:absolute; left:64px; top:112px; display:none; } /* the tab already says Connectors; keeps the corner free for the video's cycle tracker */
  .ctitle h2 { margin:0; font-size:34px; font-weight:650; letter-spacing:-.01em; }
  .ctitle p { margin:6px 0 0; color:var(--ink-soft); font-size:15px; }
  .grid { position:absolute; top:244px; width:612px; display:grid; grid-template-columns:repeat(3,192px); gap:34px 18px; }
  .rowlab { position:absolute; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; white-space:nowrap; }
  /* Logo cards are full white tiles (like the light Connect page) floating on the dark board */
  .tile { position:relative; height:150px; border-radius:22px; background:#ffffff; border:2px solid #ffffff;
    box-shadow:0 18px 38px #02060f99; display:grid; place-items:center; }
  .plate { width:100%; height:100%; display:grid; place-items:center; }
  .plate img { max-width:128px; max-height:70px; object-fit:contain; display:block; }
  .tile .nm { position:absolute; bottom:12px; left:0; right:0; text-align:center; font-size:12px; font-weight:600; color:var(--ink-soft); }
  .tile .plus { position:absolute; right:-9px; top:-9px; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    background:#1a2942; border:1px solid #2d4262; color:#c9d6e8; box-shadow:0 4px 12px #0008; }
  .tile .plus .p { display:grid; place-items:center; width:16px; height:16px; }
  .tile .plus svg { width:16px; height:16px; display:block; }
  .tile.upload { border:2px dashed #9fb6d6; background:#ffffff; box-shadow:0 18px 38px #02060f99; }
  .up { display:flex; flex-direction:column; align-items:center; gap:10px; color:#1f3a5f; font-size:14px; font-weight:700; }
  .up .ui { width:54px; height:54px; border-radius:16px; display:grid; place-items:center; background:#e8f1fd; border:1px solid #b8d2f3; }
  .ukg { width:84px; height:84px; border-radius:50%; background:#005151; color:#fff; display:grid; place-items:center; font:800 26px/1 "Segoe UI",sans-serif; letter-spacing:.02em; }
  .hs { font:700 21px/1 "Segoe UI",sans-serif; color:#0b4f8a; letter-spacing:-.01em; }
  .hs b { color:#00a3a6; font-weight:700; }
  .oh { display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  .oh img { width:112px; height:auto; max-height:none; }
  .oh span { font:600 19px/1 "Segoe UI",sans-serif; color:#6b6b6b; margin-left:1px; }

  /* Policies panel */
  #policies { position:absolute; top:110px; width:600px; height:668px; display:none; padding:20px 22px; }
  #policies .hd { display:flex; justify-content:space-between; align-items:center; }
  #policies .hd b { font-size:18px; font-weight:650; }
  .drop { margin-top:14px; height:104px; border-radius:14px; border:1.5px dashed #3a5680; background:#0a1322; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .drop .a { font-size:14px; font-weight:650; }
  .drop .b { font-size:12px; color:var(--ink-faint); }
  .docs { margin-top:14px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .doc { height:66px; border-radius:12px; background:#0b1424; border:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 11px; }
  .doc .fi { width:30px; height:36px; flex:0 0 30px; border-radius:5px; position:relative; display:grid; place-items:end center; padding-bottom:4px; font-size:8.5px; font-weight:800; color:#fff; }
  .doc .fn { font-size:12px; font-weight:600; line-height:1.3; color:#d6e1f0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .doc .pr { position:absolute; left:0; bottom:0; height:3px; border-radius:2px; background:var(--good); }
</style>
</head>
<body>
<div id="stage"><div id="world">

  <!-- Shared top bar -->
  <header class="bar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 4.5 5.6v6.1c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V5.6Z"/><path d="m8.6 12.2 2.4 2.4 4.6-4.8"/></svg></div>
      <div><div class="eb">AI Compliance for Health Systems</div><h1>Compliance Hub</h1></div>
    </div>
    <nav class="tabs" id="tabs"><span data-v="hub">Overview</span><span data-v="ready">Readiness</span><span data-v="connectors">Connectors</span><span data-v="graph">Knowledge graph</span></nav>
    <span class="live"><span class="dot" id="livedot"></span>LIVE</span>
  </header>

  <!-- ── Hub ── -->
  <section class="view" id="v-hub"></section>

  <!-- ── Connectors ── -->
  <section class="view" id="v-connectors">
    <div class="ctitle" id="ctitle"><h2>Connectors</h2><p>Every system, document, and requirement in one place</p></div>
    <div class="grid" id="grid"></div>
    <div class="mod" id="policies">
      <div class="hd"><b>Policies &amp; documents</b><span class="chip" id="doccount">0 files</span></div>
      <div class="drop"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7fbaff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span class="a">Drop files here</span><span class="b">Policies, spreadsheets, scanned checklists</span></div>
      <div class="docs" id="docs"></div>
    </div>
  </section>

  <!-- ── Knowledge graph (live, recorded in real time) ── -->
  <section class="view" id="v-graph"><iframe id="gframe" title="Knowledge graph" style="position:absolute;left:0;top:79px;width:1440px;height:731px;border:0;background:transparent"></iframe></section>

</div></div>

<script>
// ───────────── helpers ─────────────
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  out: (p) => 1 - Math.pow(1 - p, 3),
  back: (p) => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
};
// progress of t through [a,b], eased
const seg = (t, a, b, e = E.io) => e(clamp((t - a) / (b - a)));
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#04101f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

const LEVELS = ["", "Not in place", "Major gaps", "Partly in place", "Mostly in place", "Survey ready"];
const levelColor = (s) => (s < 2.6 ? "var(--crit)" : s < 3.6 ? "var(--warn)" : "var(--good)");
const levelHex = (s) => (s < 2.6 ? "#f0645a" : s < 3.6 ? "#e9b040" : "#3fd18b");
const mixHex = (a, b, p) => {
  const pa = a.match(/\w\w/g).map((h) => parseInt(h, 16)), pb = b.match(/\w\w/g).map((h) => parseInt(h, 16));
  return "#" + pa.map((v, i) => Math.round(lerp(v, pb[i], p)).toString(16).padStart(2, "0")).join("");
};
// smooth colour along red → amber → green as the score rises
const scoreHex = (s) => (s <= 2.4 ? "#f0645a" : s <= 3.1 ? mixHex("f0645a", "e9b040", (s - 2.4) / 0.7) : s <= 3.8 ? mixHex("e9b040", "3fd18b", (s - 3.1) / 0.7) : "#3fd18b");

// ───────────── camera ─────────────
// Rects are in untransformed world px. focus() frames a rect to fill the 1440x810 stage.
const world = $("#world");
const VIEW = { x: 0, y: 0, w: 1440, h: 810 };
function rectOf(node, pad = 0) {
  const prev = world.style.transform; world.style.transform = "none";
  const r = node.getBoundingClientRect(); world.style.transform = prev;
  return { x: r.left - pad, y: r.top - pad, w: r.width + pad * 2, h: r.height + pad * 2 };
}
function fit(r) {
  // grow the rect to 16:9 around its centre
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  let w = r.w, h = r.h;
  if (w / h > 16 / 9) h = w * 9 / 16; else w = h * 16 / 9;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}
const mixRect = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p) });
const NOCAM = new URLSearchParams(location.search).has("nocam");
function camera(r) {
  if (NOCAM) { world.style.transform = "none"; return; }
  const f = fit(r), s = 1440 / f.w;
  world.style.transform = `translate(${-f.x * s}px, ${-f.y * s}px) scale(${s})`;
}
// keyframes: [[time, rect], ...] — eased between neighbours
function camAt(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return mixRect(keys[i - 1][1], keys[i][1], seg(t, keys[i - 1][0], keys[i][0]));
  return keys[keys.length - 1][1];
}

// ───────────── data ─────────────
const AREAS = [
  "People and competence", "Medication system", "Patient safety practices", "Infection, testing, and tissue",
  "Record and rights", "Care delivery", "Leadership and improvement", "Place, utilities, emergencies, and information",
];
const SHORT = ["People and competence", "Medication system", "Patient safety practices", "Infection, testing & tissue",
  "Record and rights", "Care delivery", "Leadership & improvement", "Place, utilities & emergencies"];
// The live hub state, a "before" (gaps) and an "after" (ready) state
const S_LIVE = [4.4, 4.2, 4.6, 4.3, 4.1, 4.5, 4.0, 3.9];
const S_BEFORE = [3.4, 2.2, 3.9, 3.1, 2.6, 3.6, 2.4, 3.0];
const S_AFTER = [4.6, 4.4, 4.7, 4.3, 4.2, 4.5, 4.1, 4.4];

// ───────────── hub view ─────────────
const hub = $("#v-hub");
const M = {};
function mod(id, x, y, w, h, title, chip) {
  const m = el("div", "mod"); Object.assign(m.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  if (title) m.appendChild(el("div", "mod-h", `<span class="mod-t">${title}</span>${chip ? `<span class="chip">${chip}</span>` : ""}`));
  hub.appendChild(m); M[id] = m; return m;
}

// KPI row
const KPIS = [
  { k: "Readiness score", v: 4.3, of: "/ 5", dec: 1, d: "▲ 0.6 this quarter", spark: [2.9, 3.1, 3.0, 3.4, 3.6, 3.8, 4.1, 4.3] },
  { k: "Requirements tracked", v: 1343, dec: 0, d: "16 chapters · 209 standards", spark: null },
  { k: "Open gaps", v: 6, dec: 0, d: "▼ 31 closed this month", spark: [40, 34, 29, 22, 17, 12, 9, 6], down: true },
  { k: "Evidence current", v: 97, of: "%", dec: 0, d: "▲ 18 pts since go-live", spark: [72, 76, 81, 85, 88, 92, 95, 97] },
  { k: "Systems connected", v: 9, dec: 0, d: "Epic · UKG · Workday +6", spark: null },
];
KPIS.forEach((k, i) => {
  const m = mod("kpi" + i, 28 + i * 280, 100, 264, 118);
  m.classList.add("kpi");
  m.innerHTML = `<div class="k">${k.k}</div><div class="v num"><span>0</span>${k.of ? `<small>${k.of}</small>` : ""}</div><div class="d">${k.d}</div>`;
  if (k.spark) {
    const lo = Math.min(...k.spark), hi = Math.max(...k.spark);

      pol.style.left = lerp(1500, 772, pin) + "px"; pol.style.opacity = pin;
      let n = 0;
      docEls.forEach((d, i) => {
        const a = 6.0 + i * 0.22, p = seg(t, a, a + 0.3, E.out);
        d.style.opacity = p; d.style.transform = `translateY(${(1 - p) * 12}px)`;
        d.querySelector(".pr").style.width = seg(t, a + 0.1, a + 0.9, E.out) * 100 + "%";
        d.querySelector(".pr").style.opacity = 1 - seg(t, a + 1.0, a + 1.3);
        if (t >= a + 0.9) n++;
      });
      $("#doccount").textContent = (n ? n + 312 : 312) + " files";
      camera(camAt(t, CAM.connectors()));
    },
  },
};

// ───────────── driver ─────────────
const q = new URLSearchParams(location.search);
let shot = SHOTS[q.get("shot")] || SHOTS.hub;
window.SHOTS = SHOTS;
window.useShot = (name) => { shot = SHOTS[name]; shot.render(0); return shot.dur; };
window.seek = (t) => shot.render(t);
const ready = Promise.all([...document.images].map((i) => (i.complete ? 1 : new Promise((r) => (i.onload = i.onerror = r))))).then(() => document.fonts.ready);
window.shotsReady = ready;
ready.then(() => {
  shot.render(Number(q.get("t") || 0));
  if (q.get("play")) {
    const t0 = performance.now();
    const loop = (now) => { shot.render((((now - t0) / 1000) % (shot.dur + 1))); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
});
</script>
</body>
