# Haven share OG: do not enable Amplify reverse-proxy for /haven/store/*
# until the API always returns HTML for those paths (no browser 302).
# Until then, the SPA shares API share URLs (VITE_HAVEN_SHARE_ORIGIN / derived).
# Optional later: hosting/amplify-custom-rules.json → Amplify Console →
# Hosting → Rewrites and redirects (share rules above the SPA fallback).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: 'index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, no-store, must-revalidate'

